name: Publish

# Each release arrives as one commit and a `vX.Y.Z` tag, pushed by the release mirror. The tag builds
# the package with no secrets, publishes that exact tarball to npm with provenance — the registry links
# the package to this run and this commit — and opens the GitHub Release. Re-running is safe: a version
# already on npm is not published again. Third-party actions are pinned by commit.
on:
  push:
    tags: ['v*']

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: The tag is a version, and matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::The tag $TAG is not vX.Y.Z."
            exit 1
          fi
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "::error::The tag $TAG does not match package.json ($version)."
            exit 1
          fi

      - run: npm ci
      - run: npm run lint && npm run typecheck
      - run: npm test

      # `npm pack` runs `prepack`, which builds `dist/`. What is uploaded is what npm will serve.
      - run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --pack-destination "$RUNNER_TEMP/package"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  # The only job that sees NPM_TOKEN (the `npm` environment, which only `v*` tags can use). It runs no
  # code from the repository and no install scripts: it publishes the tarball `build` produced.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write   # npm provenance
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package

      # The token can write every package of the organization: publish this one, at this version, only.
      - id: published
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tarball=$(ls package/*.tgz)
          name=$(tar -xOzf "$tarball" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0)).name")
          version=$(tar -xOzf "$tarball" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          if [ "$name" != "@liguelead/api-sdk" ] || [ "v$version" != "$TAG" ]; then
            echo "::error::The tarball is $name@$version; this tag publishes @liguelead/api-sdk@${TAG#v}."
            exit 1
          fi
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version is already on npm — publish skipped."
            echo "published=true"  >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.published.outputs.published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ steps.published.outputs.tarball }}
        run: npm publish "$TARBALL" --provenance --access public --ignore-scripts

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the GitHub Release
    steps:
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            `npm install @liguelead/api-sdk@${{ steps.version.outputs.version }}`

            What changed is in the [CHANGELOG](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md).
